name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Create venv and install dependencies
        run: |
          uv venv --python 3.13
          uv sync --all-extras

      # --no-sync is required: a bare `uv run` re-syncs the environment
      # against uv.lock, which can half-downgrade what the step above
      # installed and break imports.
      - name: Run tests
        run: uv run --no-sync pytest -v

  frontend:
    name: Frontend tests (Node.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run tests
        working-directory: frontend
        run: npm test
